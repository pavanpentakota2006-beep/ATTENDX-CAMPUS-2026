name: ATTENDX CAMPUS 2026 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ai-service-tests:
    name: Test AI Service (Python + Scikit-Learn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
      - name: Run Pytest Anomaly & Prediction Tests
        run: |
          cd ai-service
          python -m pytest tests/ -v

  backend-tests:
    name: Test Core Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          cd backend
          mvn test -B

  frontend-build:
    name: Build Frontend (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
